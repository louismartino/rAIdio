name: Morning Radio

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Newsletter date (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string

jobs:
  run-radio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Run morning radio pipeline
        env:
          # Secrets (Settings → Secrets and variables → Actions → Secrets)
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FASTAPI_API_KEY: ${{ secrets.FASTAPI_API_KEY }}

          # Variables (Settings → Secrets and variables → Actions → Variables)
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          USER_FIRST_NAME: ${{ vars.USER_FIRST_NAME }}
          NEWSLETTER_ORDER: ${{ vars.NEWSLETTER_ORDER }}
          NEWSLETTER_LIMIT_NAME: ${{ vars.NEWSLETTER_LIMIT_NAME }}
          NEWSLETTER_LIMIT_COUNT: ${{ vars.NEWSLETTER_LIMIT_COUNT }}
          PROMPT_TEMPLATE_PATH: ${{ vars.PROMPT_TEMPLATE_PATH }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}

          TARGET_DATE: ${{ inputs.target_date }}
        run: raidio
